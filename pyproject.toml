[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my_small_tools"
version = "0.1.0"
description = "Collection of my tools for every day"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "appdirs>=1.4.4",
    "prompt_toolkit>=3.0",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "plotly>=5.0",
    "python-dateutil>=2.8",
    "Pillow>=10.0.0",
    "scipy>=1.10.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "marko>=2.0.0",
    "python-dotenv>=1.0.0",
    "youtube-transcript-api>=1.2.3",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
]

[project.scripts]
writing-forge = "my_small_tools.writing_forge.main:cli"
sync-knowledge-base = "my_small_tools.sync_knowledge_base:main"
hermes-research = "my_small_tools.hermes_research.hermes_research_manager:main"
ls-time = "my_small_tools.ls_time:main"
ffmpeg_convert = "my_small_tools.ffmpeg_convert:main"
forecast = "my_small_tools.forecast:main"
remove_bg = "my_small_tools.remove_bg:main"
youtube-transcribe = "my_small_tools.youtube_transcribe:main"
create_agent_worktree = "my_small_tools.create_agent_worktree:main"